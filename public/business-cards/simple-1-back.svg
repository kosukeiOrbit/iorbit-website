<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Clean White Background -->
  <rect width="350" height="200" fill="#ffffff"/>

  <!-- Company Info -->
  <g transform="translate(40, 50)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#1f2937">株式会社iOrbit</text>

    <text x="0" y="30" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">所在地</text>
    <text x="0" y="45" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#374151">〒581-0003</text>
    <text x="0" y="60" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#374151">大阪府八尾市本町６－１４－１５</text>
  </g>

  <!-- Services -->
  <g transform="translate(40, 130)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="url(#blueGrad)">Technology Solutions</text>

    <text x="0" y="20" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">• Windows Application Development</text>
    <text x="0" y="35" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">• Web Application Development</text>
    <text x="180" y="20" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">• Mobile Application Development</text>
    <text x="180" y="35" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6b7280">• AI Trading Bot Development</text>
  </g>

  <!-- Decorative Orbital Pattern -->
  <g transform="translate(280, 60)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="url(#blueGrad)" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="url(#blueGrad)" stroke-width="1" stroke-dasharray="2,1" opacity="0.5"/>
    <circle cx="0" cy="0" r="2" fill="url(#blueGrad)" opacity="0.7"/>
  </g>

  <!-- Simple Blue Line -->
  <line x1="40" y1="120" x2="310" y2="120" stroke="url(#blueGrad)" stroke-width="1"/>

  <!-- Subtle Border -->
  <rect x="10" y="10" width="330" height="180" fill="none" stroke="#e5e7eb" stroke-width="1" rx="5"/>
</svg>