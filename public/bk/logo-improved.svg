<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="improvedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 'i' のドット -->
  <circle cx="12" cy="12" r="2.5" fill="url(#improvedGrad)" filter="url(#softGlow)"/>

  <!-- 'i' の縦線 -->
  <rect x="10.5" y="17" width="3" height="14" rx="1.5" fill="url(#improvedGrad)" filter="url(#softGlow)"/>

  <!-- 'O' - 軌道リング（点線） -->
  <circle cx="25" cy="20" r="8" fill="none" stroke="url(#improvedGrad)" stroke-width="2" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- 中央の核 -->
  <circle cx="25" cy="20" r="2" fill="url(#improvedGrad)"/>

  <!-- 軌道上の天体 -->
  <circle cx="33" cy="20" r="1.2" fill="#f59e0b">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 25 20"
      to="360 25 20"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <!-- 装飾的な小さな軌道 -->
  <circle cx="25" cy="20" r="5" fill="none" stroke="url(#improvedGrad)" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>

  <!-- テキスト部分 -->
  <text x="44" y="18" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="url(#improvedGrad)">
    iOrbit
  </text>
  <text x="44" y="30" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#64748B">
    TECHNOLOGY
  </text>
</svg>