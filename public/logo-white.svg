<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="whiteGlow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 'i' のドット -->
  <circle cx="12" cy="12" r="2.5" fill="#ffffff" filter="url(#whiteGlow)"/>

  <!-- 'i' の縦線 -->
  <rect x="10.5" y="17" width="3" height="14" rx="1.5" fill="#ffffff" filter="url(#whiteGlow)"/>

  <!-- 'O' - 軌道リング（点線） -->
  <circle cx="28" cy="21" r="10" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2" opacity="0.9"/>

  <!-- 中央の核 -->
  <circle cx="28" cy="21" r="2.5" fill="#ffffff"/>

  <!-- 軌道上の天体 -->
  <circle cx="38" cy="21" r="1.5" fill="#f59e0b">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 28 21"
      to="360 28 21"
      dur="6s"
      repeatCount="indefinite"/>
  </circle>

  <!-- 装飾的な小さな軌道 -->
  <circle cx="28" cy="21" r="6" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- テキスト部分 -->
  <text x="44" y="20" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    iOrbit
  </text>
  <text x="44" y="32" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="rgba(255,255,255,0.8)">
    TECHNOLOGY
  </text>
</svg>