<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Orbital rings background -->
  <g opacity="0.6">
    <circle cx="20" cy="20" r="16" fill="none" stroke="url(#orbitGradient)" stroke-width="0.5" stroke-dasharray="2,3"/>
    <circle cx="20" cy="20" r="12" fill="none" stroke="url(#orbitGradient)" stroke-width="0.5" stroke-dasharray="1,2"/>
  </g>

  <!-- Main logo icon -->
  <g filter="url(#glow)">
    <!-- Letter "i" with orbital dot -->
    <circle cx="20" cy="10" r="2" fill="url(#logoGradient)"/>
    <rect x="18" y="15" width="4" height="14" rx="2" fill="url(#logoGradient)"/>

    <!-- Orbital ring around "i" -->
    <circle cx="20" cy="20" r="15" fill="none" stroke="url(#logoGradient)" stroke-width="2" stroke-linecap="round" stroke-dasharray="8,4"/>

    <!-- Orbital particle -->
    <circle cx="35" cy="20" r="1.5" fill="#f59e0b">
      <animateTransform
        attributeName="transform"
        attributeType="XML"
        type="rotate"
        from="0 20 20"
        to="360 20 20"
        dur="8s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Company name text -->
  <g>
    <text x="44" y="18" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="url(#logoGradient)">iOrbit</text>
    <text x="44" y="30" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#64748b" letter-spacing="0.5px">TECHNOLOGY</text>
  </g>
</svg>