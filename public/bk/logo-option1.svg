<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
  </defs>

  <!-- 六角形のフレーム -->
  <polygon points="12,20 16,12 24,12 28,20 24,28 16,28" fill="none" stroke="url(#techGrad)" stroke-width="2"/>

  <!-- 中央の"i" -->
  <circle cx="20" cy="16" r="1.5" fill="url(#techGrad)"/>
  <rect x="19" y="19" width="2" height="8" rx="1" fill="url(#techGrad)"/>

  <!-- 軌道上の点々 -->
  <circle cx="32" cy="20" r="1" fill="#f59e0b">
    <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="8" cy="20" r="0.8" fill="#f59e0b" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="180 20 20" to="540 20 20" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- テキスト -->
  <text x="44" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="url(#techGrad)">iOrbit</text>
  <text x="44" y="30" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748b">TECHNOLOGY</text>
</svg>