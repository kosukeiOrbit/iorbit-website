<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="350" height="200" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- iOrbit Logo -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#primaryGrad)">iOrbit</text>
    <circle cx="80" cy="-8" r="8" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-dasharray="2,1" opacity="0.8"/>
  </g>

  <!-- Name -->
  <text x="30" y="80" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1f2937">高橋 宏輔</text>
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">代表取締役</text>

  <!-- Company -->
  <text x="30" y="130" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2937">株式会社iOrbit</text>

  <!-- Contact -->
  <text x="30" y="150" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">info@iorbit.jp</text>
  <text x="30" y="170" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">https://iorbit.jp</text>
</svg>