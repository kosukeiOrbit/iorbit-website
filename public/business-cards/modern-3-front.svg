<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="typoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#333333;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <clipPath id="textClip">
      <text x="50" y="80" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900">iOrbit</text>
    </clipPath>
  </defs>

  <!-- Clean White Background -->
  <rect width="350" height="200" fill="#ffffff"/>

  <!-- Massive Typography as Background -->
  <g opacity="0.05">
    <text x="-20" y="60" font-family="'Arial Black', sans-serif" font-size="120" font-weight="900" fill="#000000" transform="rotate(-5)">i</text>
    <text x="80" y="140" font-family="'Arial Black', sans-serif" font-size="80" font-weight="900" fill="#000000" transform="rotate(10)">O</text>
    <text x="200" y="80" font-family="'Arial Black', sans-serif" font-size="100" font-weight="900" fill="#000000" transform="rotate(-3)">r</text>
  </g>

  <!-- Main iOrbit Text with Gradient Fill -->
  <g clip-path="url(#textClip)">
    <rect width="350" height="200" fill="url(#typoGrad)"/>
    <!-- Layered textures within text -->
    <line x1="0" y1="40" x2="350" y2="40" stroke="#ff0080" stroke-width="8" opacity="0.3"/>
    <line x1="0" y1="55" x2="350" y2="55" stroke="#00ff80" stroke-width="6" opacity="0.3"/>
    <line x1="0" y1="70" x2="350" y2="70" stroke="#8000ff" stroke-width="4" opacity="0.3"/>
  </g>

  <!-- Clean Typography -->
  <text x="50" y="80" font-family="'Arial Black', sans-serif" font-size="48" font-weight="900" fill="none" stroke="#000000" stroke-width="2"/>

  <!-- Minimal Info -->
  <g transform="translate(50, 120)">
    <line x1="0" y1="0" x2="80" y2="0" stroke="#000000" stroke-width="1"/>
    <text x="0" y="20" font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="300" fill="#000000">高橋 宏輔</text>
    <text x="0" y="40" font-family="'Helvetica Neue', sans-serif" font-size="8" fill="#666666" letter-spacing="2px">REPRESENTATIVE DIRECTOR</text>
    <text x="0" y="60" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#000000">info@iorbit.jp</text>
  </g>

  <!-- Minimal Accent -->
  <circle cx="280" cy="50" r="2" fill="#ff0080"/>
  <circle cx="290" cy="50" r="2" fill="#00ff80"/>
  <circle cx="300" cy="50" r="2" fill="#8000ff"/>

  <!-- Thin Border -->
  <rect x="5" y="5" width="340" height="190" fill="none" stroke="#000000" stroke-width="0.5"/>
</svg>