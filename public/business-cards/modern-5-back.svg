<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="orbitalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.4" />
      <stop offset="50%" style="stop-color:#f093fb;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="dataStream" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="350" height="200" fill="url(#orbitalGlow)"/>

  <!-- Orbital System -->
  <g transform="translate(175, 100)">
    <!-- Central Core -->
    <circle cx="0" cy="0" r="8" fill="#00ffff" opacity="0.8"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>

    <!-- Orbit Rings -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.6" stroke-dasharray="8,4"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.4" stroke-dasharray="12,6"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#f093fb" stroke-width="1" opacity="0.3" stroke-dasharray="16,8"/>

    <!-- Service Nodes -->
    <circle cx="30" cy="0" r="4" fill="#00ffff"/>
    <text x="35" y="3" font-family="'Orbitron', 'Arial', sans-serif" font-size="6" fill="#ffffff">WEB</text>

    <circle cx="0" cy="-45" r="4" fill="#ff6b6b"/>
    <text x="-8" y="-50" font-family="'Orbitron', 'Arial', sans-serif" font-size="6" fill="#ffffff">WIN</text>

    <circle cx="-40" cy="20" r="4" fill="#f093fb"/>
    <text x="-55" y="25" font-family="'Orbitron', 'Arial', sans-serif" font-size="6" fill="#ffffff">MOBILE</text>

    <circle cx="20" cy="50" r="4" fill="#ffff00"/>
    <text x="15" y="65" font-family="'Orbitron', 'Arial', sans-serif" font-size="6" fill="#ffffff">AI</text>

    <!-- Connection Lines -->
    <line x1="0" y1="0" x2="30" y2="0" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="-40" y2="20" stroke="#f093fb" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="20" y2="50" stroke="#ffff00" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Company Data Panel -->
  <rect x="20" y="20" width="140" height="100" fill="rgba(0,0,0,0.7)" stroke="#00ffff" stroke-width="1"/>

  <g transform="translate(30, 35)">
    <text x="0" y="0" font-family="'Orbitron', 'Arial', sans-serif" font-size="10" fill="#00ffff">ENTITY_DATA:</text>

    <text x="0" y="15" font-family="'Orbitron', 'Arial', sans-serif" font-size="11" fill="#ffffff" font-weight="600">株式会社iOrbit</text>

    <text x="0" y="30" font-family="'Orbitron', 'Arial', sans-serif" font-size="8" fill="#ff6b6b">COORDINATES:</text>
    <text x="0" y="42" font-family="'Orbitron', 'Arial', sans-serif" font-size="7" fill="#ffffff">581-0003</text>
    <text x="0" y="52" font-family="'Orbitron', 'Arial', sans-serif" font-size="7" fill="#ffffff">大阪府八尾市本町６－１４－１５</text>

    <text x="0" y="67" font-family="'Orbitron', 'Arial', sans-serif" font-size="8" fill="#f093fb">NETWORK_ADDRESS:</text>
    <text x="0" y="78" font-family="'Orbitron', 'Arial', sans-serif" font-size="8" fill="#ffffff">https://iorbit.jp</text>

    <text x="0" y="90" font-family="'Orbitron', 'Arial', sans-serif" font-size="6" fill="#00ffff">STATUS: PREMIUM_TECH_PARTNER</text>
  </g>

  <!-- Data Streams -->
  <g transform="translate(0, 140)">
    <rect x="20" y="0" width="310" height="2" fill="url(#dataStream)"/>
    <rect x="20" y="10" width="200" height="1" fill="url(#dataStream)" opacity="0.6"/>
    <rect x="20" y="20" width="280" height="1" fill="url(#dataStream)" opacity="0.4"/>

    <text x="20" y="35" font-family="'Orbitron', 'Arial', sans-serif" font-size="7" fill="#00ffff">TRANSMITTING: INNOVATION • TECHNOLOGY • TRANSFORMATION</text>
    <text x="20" y="50" font-family="'Orbitron', 'Arial', sans-serif" font-size="6" fill="#ffffff" opacity="0.7">PROTOCOL: BUSINESS_EVOLUTION_2025</text>
  </g>

  <!-- Corner Interface Elements -->
  <line x1="0" y1="0" x2="20" y2="0" stroke="#00ffff" stroke-width="2"/>
  <line x1="0" y1="0" x2="0" y2="20" stroke="#00ffff" stroke-width="2"/>

  <line x1="350" y1="0" x2="330" y2="0" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="350" y1="0" x2="350" y2="20" stroke="#ff6b6b" stroke-width="2"/>

  <line x1="0" y1="200" x2="20" y2="200" stroke="#f093fb" stroke-width="2"/>
  <line x1="0" y1="200" x2="0" y2="180" stroke="#f093fb" stroke-width="2"/>

  <line x1="350" y1="200" x2="330" y2="200" stroke="#ffff00" stroke-width="2"/>
  <line x1="350" y1="200" x2="350" y2="180" stroke="#ffff00" stroke-width="2"/>
</svg>