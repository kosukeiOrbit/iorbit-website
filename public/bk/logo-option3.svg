<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="networkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
  </defs>

  <!-- 中央のノード -->
  <circle cx="20" cy="20" r="4" fill="url(#networkGrad)"/>
  <text x="20" y="24" font-family="Inter, sans-serif" font-size="10" font-weight="700" fill="white" text-anchor="middle">i</text>

  <!-- 接続ネットワーク -->
  <line x1="24" y1="20" x2="32" y2="14" stroke="url(#networkGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="20" x2="32" y2="26" stroke="url(#networkGrad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="16" y1="20" x2="8" y2="16" stroke="url(#networkGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- サブノード -->
  <circle cx="32" cy="14" r="2" fill="#f59e0b"/>
  <circle cx="32" cy="26" r="2" fill="#f59e0b"/>
  <circle cx="8" cy="16" r="1.5" fill="#f59e0b" opacity="0.7"/>

  <!-- テキスト -->
  <text x="44" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="url(#networkGrad)">iOrbit</text>
  <text x="44" y="30" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748b">TECHNOLOGY</text>
</svg>