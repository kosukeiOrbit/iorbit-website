<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Clean White Background -->
  <rect width="350" height="200" fill="#ffffff"/>

  <!-- Company Title -->
  <g transform="translate(40, 40)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="url(#blueGrad)">株式会社iOrbit</text>
    <line x1="0" y1="10" x2="150" y2="10" stroke="url(#blueGrad)" stroke-width="2"/>
  </g>

  <!-- Address -->
  <g transform="translate(40, 80)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="600">ADDRESS</text>
    <text x="0" y="18" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#374151">〒581-0003 大阪府八尾市本町６－１４－１５</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(40, 120)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="600">TAGLINE</text>
    <text x="0" y="18" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#374151">最先端技術とイノベーションで、</text>
    <text x="0" y="33" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#374151">お客様のビジネス変革を実現</text>
  </g>

  <!-- Simple Orbital Decoration -->
  <g transform="translate(280, 100)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="url(#blueGrad)" stroke-width="2" stroke-dasharray="5,3" opacity="0.4"/>
    <circle cx="0" cy="0" r="15" fill="none" stroke="url(#blueGrad)" stroke-width="1" stroke-dasharray="3,2" opacity="0.6"/>
    <circle cx="0" cy="0" r="8" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.8"/>
    <circle cx="0" cy="0" r="3" fill="url(#blueGrad)"/>

    <!-- Small orbiting elements -->
    <circle cx="20" cy="0" r="2" fill="#f59e0b" opacity="0.8"/>
    <circle cx="-15" cy="15" r="1.5" fill="url(#blueGrad)" opacity="0.6"/>
  </g>

  <!-- Subtle Border -->
  <rect x="5" y="5" width="340" height="190" fill="none" stroke="#e5e7eb" stroke-width="1" rx="8"/>
</svg>