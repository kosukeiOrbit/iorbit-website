<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dataGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fc466b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Dark Tech Background -->
  <rect width="350" height="200" fill="url(#dataGrad)"/>

  <!-- Data Matrix Grid -->
  <g opacity="0.2">
    <line x1="0" y1="40" x2="350" y2="40" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="350" y2="80" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="350" y2="120" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="350" y2="160" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="70" y1="0" x2="70" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="140" y1="0" x2="140" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="210" y1="0" x2="210" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="280" y1="0" x2="280" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
  </g>

  <!-- Company Data Block -->
  <g transform="translate(30, 40)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="14" fill="url(#accentGrad)" font-weight="bold">株式会社iOrbit</text>
    <text x="0" y="20" font-family="'Courier New', monospace" font-size="9" fill="#00f5ff">[LOCATION] 大阪府八尾市本町６－１４－１５</text>
    <text x="0" y="35" font-family="'Courier New', monospace" font-size="9" fill="#00f5ff">[POSTAL] 581-0003</text>
    <text x="0" y="50" font-family="'Courier New', monospace" font-size="9" fill="#fc466b">[WEB] https://iorbit.jp</text>
  </g>

  <!-- Service Array -->
  <g transform="translate(30, 120)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.9">SERVICES[] = {</text>
    <text x="20" y="15" font-family="'Courier New', monospace" font-size="8" fill="#00f5ff">"windows_apps",</text>
    <text x="20" y="27" font-family="'Courier New', monospace" font-size="8" fill="#00f5ff">"web_development",</text>
    <text x="20" y="39" font-family="'Courier New', monospace" font-size="8" fill="#00f5ff">"mobile_apps",</text>
    <text x="20" y="51" font-family="'Courier New', monospace" font-size="8" fill="#00f5ff">"ai_trading_bots"</text>
    <text x="0" y="63" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.9">}</text>
  </g>

  <!-- Binary Pattern -->
  <g transform="translate(250, 30)" opacity="0.3">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="6" fill="#00f5ff">1010110</text>
    <text x="0" y="12" font-family="'Courier New', monospace" font-size="6" fill="#fc466b">0110101</text>
    <text x="0" y="24" font-family="'Courier New', monospace" font-size="6" fill="#00f5ff">1101001</text>
    <text x="0" y="36" font-family="'Courier New', monospace" font-size="6" fill="#fc466b">0101110</text>
  </g>

  <!-- Circuit Lines -->
  <path d="M200,50 L220,50 L220,70 L240,70" stroke="#00f5ff" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="240" cy="70" r="3" fill="#fc466b" opacity="0.8"/>
  <path d="M200,130 L230,130 L230,110 L260,110" stroke="#fc466b" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="260" cy="110" r="3" fill="#00f5ff" opacity="0.8"/>
</svg>