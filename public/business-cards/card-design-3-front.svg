  <circle cx="300" cy="50" r="2" fill="#2563eb"/>
  <circle cx="310" cy="60" r="1.5" fill="#f59e0b"/>
  <circle cx="320" cy="70" r="1" fill="#2563eb" opacity="0.5"/>
</svg>