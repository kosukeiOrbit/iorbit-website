<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="holoGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#f5576c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f0f9ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#dbeafe;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Holographic Background -->
  <rect width="350" height="200" fill="url(#holoGrad1)" transform="skewY(-2)"/>

  <!-- Geometric Overlay -->
  <polygon points="0,0 100,0 150,50 50,200 0,200" fill="rgba(255,255,255,0.1)" transform="rotate(5 175 100)"/>
  <polygon points="350,0 350,100 250,150 200,50" fill="rgba(255,255,255,0.05)" transform="rotate(-3 175 100)"/>

  <!-- Futuristic iOrbit -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="28" font-weight="300" fill="url(#textGrad)" filter="url(#glow)" letter-spacing="4px">iORBIT</text>
    <path d="M-10,10 Q20,30 50,10 Q80,30 110,10" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
  </g>

  <!-- Floating Data Elements -->
  <g opacity="0.7">
    <text x="60" y="120" font-family="'Courier New', monospace" font-size="14" fill="rgba(255,255,255,0.9)" font-weight="bold">高橋 宏輔</text>
    <text x="60" y="140" font-family="'Courier New', monospace" font-size="8" fill="rgba(255,255,255,0.7)">[REPRESENTATIVE_DIRECTOR]</text>

    <text x="60" y="170" font-family="'Courier New', monospace" font-size="10" fill="rgba(255,255,255,0.8)">info@iorbit.jp</text>
  </g>

  <!-- Digital Noise Pattern -->
  <rect x="250" y="30" width="2" height="30" fill="rgba(255,255,255,0.3)"/>
  <rect x="255" y="20" width="1" height="40" fill="rgba(255,255,255,0.2)"/>
  <rect x="258" y="35" width="3" height="20" fill="rgba(255,255,255,0.4)"/>
  <rect x="265" y="25" width="1" height="35" fill="rgba(255,255,255,0.25)"/>

  <!-- Orbital Trail -->
  <path d="M200,50 Q250,80 300,50 Q320,70 300,90 Q250,120 200,90 Q180,70 200,50" stroke="rgba(255,255,255,0.3)" stroke-width="1" fill="none" stroke-dasharray="5,3"/>
</svg>