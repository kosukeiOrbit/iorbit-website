<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="minimalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- 'i' のドット（ダイヤモンド型） -->
  <polygon points="12,9 15,12 12,15 9,12" fill="url(#minimalGrad)"/>

  <!-- 'i' の縦線 -->
  <rect x="10.5" y="17" width="3" height="14" rx="1.5" fill="url(#minimalGrad)"/>

  <!-- 幾何学的軌道（三角形） -->
  <polygon points="25,12 33,24 17,24" fill="none" stroke="url(#minimalGrad)" stroke-width="2" stroke-dasharray="4,2" opacity="0.7"/>

  <!-- 中央のポイント -->
  <circle cx="25" cy="20" r="1.5" fill="url(#minimalGrad)"/>

  <!-- 軌道上の図形 -->
  <g>
    <polygon points="25,12 26,13 25,14 24,13" fill="#f59e0b"/>
    <animateTransform attributeName="transform" type="rotate" from="0 25 20" to="360 25 20" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- 装飾的な小さな図形 -->
  <circle cx="30" cy="16" r="0.8" fill="#f97316" opacity="0.6"/>
  <polygon points="20,24 21,25 20,26 19,25" fill="#f97316" opacity="0.6"/>

  <!-- テキスト -->
  <text x="44" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="url(#minimalGrad)">iOrbit</text>
  <text x="44" y="30" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748B">TECHNOLOGY</text>
</svg>