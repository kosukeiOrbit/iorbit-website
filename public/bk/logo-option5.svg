<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
  </defs>

  <!-- 回路基板パターン -->
  <rect x="12" y="12" width="16" height="16" rx="2" fill="none" stroke="url(#circuitGrad)" stroke-width="1"/>

  <!-- 内部の回路 -->
  <line x1="16" y1="20" x2="24" y2="20" stroke="url(#circuitGrad)" stroke-width="1"/>
  <line x1="20" y1="16" x2="20" y2="24" stroke="url(#circuitGrad)" stroke-width="1"/>

  <!-- 中央のチップ（"i"） -->
  <rect x="18" y="18" width="4" height="4" rx="0.5" fill="url(#circuitGrad)"/>
  <text x="20" y="21.5" font-family="Inter, sans-serif" font-size="6" font-weight="700" fill="white" text-anchor="middle">i</text>

  <!-- 接続ポイント -->
  <circle cx="14" cy="16" r="1" fill="#f59e0b"/>
  <circle cx="26" cy="24" r="1" fill="#f59e0b"/>
  <circle cx="30" cy="20" r="0.8" fill="#f59e0b" opacity="0.7"/>

  <!-- テキスト -->
  <text x="44" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="url(#circuitGrad)">iOrbit</text>
  <text x="44" y="30" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748b">TECHNOLOGY</text>
</svg>