<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="doubleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- 'i' のドット -->
  <circle cx="12" cy="12" r="2.5" fill="url(#doubleGrad)"/>

  <!-- 'i' の縦線 -->
  <rect x="10.5" y="17" width="3" height="14" rx="1.5" fill="url(#doubleGrad)"/>

  <!-- 外側軌道 -->
  <circle cx="25" cy="20" r="10" fill="none" stroke="url(#doubleGrad)" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.6"/>

  <!-- 内側軌道 -->
  <circle cx="25" cy="20" r="6" fill="none" stroke="url(#doubleGrad)" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.8"/>

  <!-- 中央の核 -->
  <circle cx="25" cy="20" r="1.5" fill="url(#doubleGrad)"/>

  <!-- 外側天体 -->
  <circle cx="35" cy="20" r="1.2" fill="#f59e0b">
    <animateTransform attributeName="transform" type="rotate" from="0 25 20" to="360 25 20" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- 内側天体 -->
  <circle cx="31" cy="20" r="0.8" fill="#f97316">
    <animateTransform attributeName="transform" type="rotate" from="0 25 20" to="360 25 20" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- テキスト -->
  <text x="44" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="url(#doubleGrad)">iOrbit</text>
  <text x="44" y="30" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748B">TECHNOLOGY</text>
</svg>