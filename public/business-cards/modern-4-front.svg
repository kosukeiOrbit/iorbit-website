<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dashGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="chartGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff6b6b;stop-opacity:0.2" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dashboard Background -->
  <rect width="350" height="200" fill="url(#dashGrad1)"/>

  <!-- Grid Lines -->
  <g opacity="0.2">
    <line x1="0" y1="50" x2="350" y2="50" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="350" y2="100" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="350" y2="150" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="70" y1="0" x2="70" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="175" y1="0" x2="175" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="280" y1="0" x2="280" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
  </g>

  <!-- Header Panel -->
  <rect x="10" y="10" width="330" height="30" fill="rgba(0,245,255,0.1)" stroke="#00f5ff" stroke-width="1"/>
  <text x="20" y="28" font-family="'Courier New', monospace" font-size="14" fill="#00f5ff" font-weight="bold">iOrbit_Dashboard.exe</text>
  <circle cx="320" cy="25" r="3" fill="#ff6b6b"/>
  <circle cx="310" cy="25" r="3" fill="#f9ca24"/>
  <circle cx="300" cy="25" r="3" fill="#00f5ff"/>

  <!-- User Panel -->
  <rect x="10" y="50" width="160" height="60" fill="rgba(255,255,255,0.05)" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
  <text x="20" y="68" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.7">USER_PROFILE:</text>
  <text x="20" y="82" font-family="'Courier New', monospace" font-size="12" fill="#00f5ff" font-weight="bold">高橋 宏輔</text>
  <text x="20" y="96" font-family="'Courier New', monospace" font-size="8" fill="#ff6b6b">ROLE: REPRESENTATIVE_DIRECTOR</text>

  <!-- Contact Data Panel -->
  <rect x="180" y="50" width="160" height="60" fill="rgba(255,255,255,0.05)" stroke="rgba(255,107,107,0.3)" stroke-width="1"/>
  <text x="190" y="68" font-family="'Courier New', monospace" font-size="10" fill="#ffffff" opacity="0.7">CONTACT_API:</text>
  <text x="190" y="82" font-family="'Courier New', monospace" font-size="10" fill="#ff6b6b">info@iorbit.jp</text>
  <text x="190" y="96" font-family="'Courier New', monospace" font-size="8" fill="#00f5ff">STATUS: ONLINE</text>

  <!-- Performance Chart -->
  <g transform="translate(20, 130)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="9" fill="#ffffff" opacity="0.7">PERFORMANCE_METRICS:</text>

    <!-- Bar Chart -->
    <rect x="0" y="10" width="15" height="25" fill="url(#chartGrad1)"/>
    <rect x="20" y="10" width="15" height="35" fill="url(#chartGrad2)"/>
    <rect x="40" y="10" width="15" height="20" fill="url(#chartGrad1)"/>
    <rect x="60" y="10" width="15" height="40" fill="url(#chartGrad2)"/>
    <rect x="80" y="10" width="15" height="30" fill="url(#chartGrad1)"/>

    <!-- Labels -->
    <text x="5" y="50" font-family="'Courier New', monospace" font-size="6" fill="#00f5ff">WEB</text>
    <text x="22" y="50" font-family="'Courier New', monospace" font-size="6" fill="#ff6b6b">WIN</text>
    <text x="42" y="50" font-family="'Courier New', monospace" font-size="6" fill="#00f5ff">MOB</text>
    <text x="65" y="50" font-family="'Courier New', monospace" font-size="6" fill="#ff6b6b">AI</text>
    <text x="82" y="50" font-family="'Courier New', monospace" font-size="6" fill="#00f5ff">CON</text>
  </g>

  <!-- Network Activity -->
  <g transform="translate(250, 130)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="9" fill="#ffffff" opacity="0.7">NETWORK:</text>
    <!-- Pulse lines -->
    <line x1="0" y1="20" x2="60" y2="20" stroke="#00f5ff" stroke-width="2" opacity="0.8" filter="url(#glow2)"/>
    <line x1="0" y1="30" x2="40" y2="30" stroke="#ff6b6b" stroke-width="2" opacity="0.6"/>
    <line x1="0" y1="40" x2="70" y2="40" stroke="#f9ca24" stroke-width="2" opacity="0.7"/>

    <!-- Status indicators -->
    <circle cx="80" cy="20" r="2" fill="#00f5ff" filter="url(#glow2)"/>
    <circle cx="80" cy="30" r="2" fill="#ff6b6b"/>
    <circle cx="80" cy="40" r="2" fill="#f9ca24"/>
  </g>

  <!-- System Border -->
  <rect x="2" y="2" width="346" height="196" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.5"/>
</svg>