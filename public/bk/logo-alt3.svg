<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- モバイルデバイスをイメージしたフレーム -->
  <rect x="10" y="8" width="18" height="28" rx="4" fill="none" stroke="url(#grad3)" stroke-width="2"/>
  <circle cx="19" cy="32" r="1.5" fill="url(#grad3)"/>

  <!-- 軌道線 -->
  <ellipse cx="35" cy="22" rx="8" ry="12" fill="none" stroke="url(#grad3)" stroke-width="2" opacity="0.7"/>

  <!-- 中心点 -->
  <circle cx="35" cy="22" r="3" fill="url(#grad3)" filter="url(#shadow)"/>

  <!-- テキスト部分 - より洗練されたフォント -->
  <text x="55" y="20" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#1E293B" letter-spacing="1px">
    i
  </text>
  <text x="66" y="20" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="url(#grad3)">
    Orbit
  </text>
  <text x="55" y="35" font-family="Arial, sans-serif" font-size="8" fill="#64748B" letter-spacing="0.5px">
    DIGITAL INNOVATION
  </text>

  <!-- 装飾的な線 -->
  <line x1="55" y1="40" x2="120" y2="40" stroke="url(#grad3)" stroke-width="1" opacity="0.5"/>
</svg>