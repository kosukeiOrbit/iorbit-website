<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="radarGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#00f5ff;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#00f5ff;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="terminalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Terminal Background -->
  <rect width="350" height="200" fill="url(#terminalGrad)"/>

  <!-- Radar Background -->
  <circle cx="280" cy="100" r="60" fill="url(#radarGrad)"/>
  <circle cx="280" cy="100" r="45" fill="none" stroke="rgba(0,245,255,0.2)" stroke-width="1"/>
  <circle cx="280" cy="100" r="30" fill="none" stroke="rgba(0,245,255,0.3)" stroke-width="1"/>
  <circle cx="280" cy="100" r="15" fill="none" stroke="rgba(0,245,255,0.4)" stroke-width="1"/>
  <line x1="280" y1="40" x2="280" y2="160" stroke="rgba(0,245,255,0.2)" stroke-width="1"/>
  <line x1="220" y1="100" x2="340" y2="100" stroke="rgba(0,245,255,0.2)" stroke-width="1"/>

  <!-- Company Data Terminal -->
  <g transform="translate(20, 20)">
    <rect x="-5" y="-5" width="200" height="160" fill="rgba(0,0,0,0.3)" stroke="#00f5ff" stroke-width="1"/>

    <!-- Terminal Header -->
    <text x="0" y="10" font-family="'Courier New', monospace" font-size="10" fill="#00f5ff">$ iorbit --company-info</text>
    <line x1="0" y1="15" x2="180" y2="15" stroke="#00f5ff" stroke-width="1"/>

    <!-- Company Output -->
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="9" fill="#ffffff">Name: "株式会社iOrbit"</text>
    <text x="0" y="42" font-family="'Courier New', monospace" font-size="9" fill="#ffffff">Type: "Technology Company"</text>
    <text x="0" y="54" font-family="'Courier New', monospace" font-size="9" fill="#ffffff">Location: {</text>
    <text x="10" y="66" font-family="'Courier New', monospace" font-size="8" fill="#f9ca24">postal: "581-0003",</text>
    <text x="10" y="76" font-family="'Courier New', monospace" font-size="8" fill="#f9ca24">city: "大阪府八尾市",</text>
    <text x="10" y="86" font-family="'Courier New', monospace" font-size="8" fill="#f9ca24">address: "本町６－１４－１５"</text>
    <text x="0" y="96" font-family="'Courier New', monospace" font-size="9" fill="#ffffff">}</text>

    <text x="0" y="110" font-family="'Courier New', monospace" font-size="8" fill="#00f5ff">$ iorbit --services</text>
    <text x="0" y="122" font-family="'Courier New', monospace" font-size="8" fill="#ff6b6b">// Windows Applications</text>
    <text x="0" y="132" font-family="'Courier New', monospace" font-size="8" fill="#ff6b6b">// Web Development</text>
    <text x="0" y="142" font-family="'Courier New', monospace" font-size="8" fill="#ff6b6b">// Mobile Applications</text>
    <text x="0" y="152" font-family="'Courier New', monospace" font-size="8" fill="#ff6b6b">// AI Trading Systems</text>
  </g>

  <!-- Radar Blips (Services) -->
  <circle cx="295" cy="85" r="2" fill="#ff6b6b"/>
  <circle cx="265" cy="115" r="2" fill="#f9ca24"/>
  <circle cx="300" cy="130" r="2" fill="#00f5ff"/>
  <circle cx="285" cy="70" r="2" fill="#ff6b6b"/>

  <!-- System Stats -->
  <g transform="translate(230, 160)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-size="8" fill="#ffffff" opacity="0.7">SYSTEM STATUS:</text>
    <text x="0" y="12" font-family="'Courier New', monospace" font-size="7" fill="#00f5ff">▼ iorbit.jp [ACTIVE]</text>
    <text x="0" y="22" font-family="'Courier New', monospace" font-size="7" fill="#f9ca24">● Premium Tech Partner</text>
    <text x="0" y="32" font-family="'Courier New', monospace" font-size="7" fill="#ff6b6b">◆ Innovation Ready</text>
  </g>

  <!-- Connection Lines -->
  <path d="M220,100 Q240,80 260,100" stroke="#00f5ff" stroke-width="1" fill="none" opacity="0.5"/>
  <path d="M220,120 Q250,110 280,120" stroke="#ff6b6b" stroke-width="1" fill="none" opacity="0.5"/>

  <!-- Border -->
  <rect x="2" y="2" width="346" height="196" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.3"/>

  <!-- Scanning line animation effect -->
  <line x1="280" y1="100" x2="320" y2="60" stroke="#00f5ff" stroke-width="2" opacity="0.8" transform="rotate(45 280 100)"/>
</svg>