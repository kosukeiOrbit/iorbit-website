<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="futureGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <pattern id="qrPattern" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="2" fill="#000000"/>
      <rect x="2" y="2" width="2" height="2" fill="#000000"/>
    </pattern>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Futuristic Background -->
  <rect width="350" height="200" fill="#0a0a0a"/>

  <!-- Holographic Header -->
  <rect x="0" y="0" width="350" height="50" fill="url(#futureGrad1)" opacity="0.8"/>
  <rect x="0" y="0" width="350" height="2" fill="#ffffff"/>

  <!-- Interface Elements -->
  <g transform="translate(20, 15)">
    <text x="0" y="0" font-family="'Orbitron', 'Arial', sans-serif" font-size="20" fill="#ffffff" font-weight="300" letter-spacing="3px" filter="url(#neon)">iORBIT</text>
    <text x="0" y="18" font-family="'Orbitron', 'Arial', sans-serif" font-size="8" fill="rgba(255,255,255,0.7)" letter-spacing="2px">PREMIUM TECHNOLOGY INTERFACE</text>
  </g>

  <!-- Scan Line Effect -->
  <line x1="0" y1="55" x2="350" y2="55" stroke="#00ffff" stroke-width="1" opacity="0.8"/>

  <!-- Main Content Area -->
  <g transform="translate(30, 70)">
    <!-- User Profile HUD -->
    <rect x="-10" y="-10" width="160" height="80" fill="rgba(0,255,255,0.1)" stroke="#00ffff" stroke-width="1"/>

    <text x="0" y="0" font-family="'Orbitron', 'Arial', sans-serif" font-size="10" fill="#00ffff" opacity="0.8">USER_ID:</text>
    <text x="0" y="15" font-family="'Orbitron', 'Arial', sans-serif" font-size="14" fill="#ffffff" font-weight="600">高橋 宏輔</text>
    <text x="0" y="30" font-family="'Orbitron', 'Arial', sans-serif" font-size="8" fill="#ff6b6b">ACCESS_LEVEL: DIRECTOR</text>

    <text x="0" y="50" font-family="'Orbitron', 'Arial', sans-serif" font-size="8" fill="#00ffff">CONTACT_PROTOCOL:</text>
    <text x="0" y="62" font-family="'Orbitron', 'Arial', sans-serif" font-size="10" fill="#ffffff">info@iorbit.jp</text>
  </g>

  <!-- QR Code Area (Stylized) -->
  <g transform="translate(230, 70)">
    <rect x="0" y="0" width="80" height="80" fill="#ffffff"/>
    <rect x="5" y="5" width="70" height="70" fill="url(#qrPattern)"/>

    <!-- QR Corner Markers -->
    <rect x="5" y="5" width="15" height="15" fill="#000000"/>
    <rect x="60" y="5" width="15" height="15" fill="#000000"/>
    <rect x="5" y="60" width="15" height="15" fill="#000000"/>

    <!-- Central Pattern -->
    <rect x="35" y="35" width="10" height="10" fill="#000000"/>

    <!-- Scan Frame -->
    <path d="M0,0 L20,0 M0,0 L0,20" stroke="#00ffff" stroke-width="3" fill="none"/>
    <path d="M80,0 L60,0 M80,0 L80,20" stroke="#00ffff" stroke-width="3" fill="none"/>
    <path d="M0,80 L20,80 M0,80 L0,60" stroke="#00ffff" stroke-width="3" fill="none"/>
    <path d="M80,80 L60,80 M80,80 L80,60" stroke="#00ffff" stroke-width="3" fill="none"/>

    <text x="40" y="95" font-family="'Orbitron', 'Arial', sans-serif" font-size="6" fill="#00ffff" text-anchor="middle">SCAN.TO.CONNECT</text>
  </g>

  <!-- Interface Lines -->
  <path d="M20,150 L200,150" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
  <path d="M220,150 L330,150" stroke="#ff6b6b" stroke-width="1" opacity="0.6"/>

  <!-- Status Indicators -->
  <g transform="translate(30, 170)">
    <circle cx="0" cy="0" r="3" fill="#00ff00"/>
    <text x="10" y="3" font-family="'Orbitron', 'Arial', sans-serif" font-size="8" fill="#00ff00">SYSTEM_ONLINE</text>

    <circle cx="100" cy="0" r="3" fill="#ffff00"/>
    <text x="110" y="3" font-family="'Orbitron', 'Arial', sans-serif" font-size="8" fill="#ffff00">INNOVATION_MODE</text>
  </g>

  <!-- Border Effect -->
  <rect x="5" y="5" width="340" height="190" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.3"/>
  <rect x="10" y="10" width="330" height="180" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.2"/>
</svg>