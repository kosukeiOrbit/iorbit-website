<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ellipseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#0369a1"/>
    </linearGradient>
  </defs>

  <!-- 中央の"i" アイコン -->
  <rect x="18" y="15" width="4" height="4" rx="2" fill="url(#ellipseGrad)"/>
  <rect x="19" y="21" width="2" height="8" rx="1" fill="url(#ellipseGrad)"/>

  <!-- 横楕円の軌道 -->
  <ellipse cx="20" cy="20" rx="15" ry="8" fill="none" stroke="url(#ellipseGrad)" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.7"/>

  <!-- 軌道上の天体 -->
  <circle cx="35" cy="20" r="1.5" fill="#f59e0b">
    <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- テキスト -->
  <text x="44" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="url(#ellipseGrad)">iOrbit</text>
  <text x="44" y="30" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748b">TECHNOLOGY</text>
</svg>