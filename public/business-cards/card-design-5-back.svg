<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="abstractOrbital" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M40,10 Q60,40 40,70 Q20,40 40,10" fill="none" stroke="rgba(37,99,235,0.1)" stroke-width="1"/>
      <path d="M10,40 Q40,20 70,40 Q40,60 10,40" fill="none" stroke="rgba(245,158,11,0.1)" stroke-width="1"/>
    </pattern>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="350" height="200" fill="url(#lightGrad)"/>
  <rect width="350" height="200" fill="url(#abstractOrbital)"/>

  <!-- Keywords -->
  <text x="30" y="40" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2563eb">Innovation • Technology • Transform</text>

  <!-- Company -->
  <text x="30" y="70" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1f2937">株式会社iOrbit</text>
  <text x="30" y="90" font-family="Arial, sans-serif" font-size="12" fill="#4b5563">大阪府八尾市本町６－１４－１５</text>
  <text x="30" y="110" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">https://iorbit.jp</text>

  <!-- Tagline -->
  <text x="30" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#f59e0b">Premium Technology Partner</text>

  <!-- Abstract orbital art -->
  <g transform="translate(250, 120)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#2563eb" stroke-width="2" opacity="0.3"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.7"/>
    <circle cx="0" cy="0" r="2" fill="#f59e0b"/>
  </g>
</svg>