<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- 'i' のドット（星型） -->
  <polygon points="12,8 13,11 16,11 13.5,13 14.5,16 12,14 9.5,16 10.5,13 8,11 11,11" fill="url(#starGrad)"/>

  <!-- 'i' の縦線 -->
  <rect x="10.5" y="17" width="3" height="14" rx="1.5" fill="url(#starGrad)"/>

  <!-- 軌道 -->
  <circle cx="25" cy="20" r="8" fill="none" stroke="url(#starGrad)" stroke-width="2" stroke-dasharray="3,4" opacity="0.7"/>

  <!-- 中央の星 -->
  <polygon points="25,17 25.8,19.2 28,19.2 26.1,20.8 26.9,23 25,21.4 23.1,23 23.9,20.8 22,19.2 24.2,19.2" fill="url(#starGrad)"/>

  <!-- 軌道上の天体（小さな星） -->
  <g>
    <polygon points="33,19 33.5,20.5 35,20.5 33.8,21.5 34.3,23 33,22 31.7,23 32.2,21.5 31,20.5 32.5,20.5" fill="#f59e0b"/>
    <animateTransform attributeName="transform" type="rotate" from="0 25 20" to="360 25 20" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- テキスト -->
  <text x="44" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="url(#starGrad)">iOrbit</text>
  <text x="44" y="30" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748B">TECHNOLOGY</text>
</svg>