<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 'i' のドット -->
  <circle cx="20" cy="15" r="4" fill="url(#grad1)"/>

  <!-- 'i' の縦線 -->
  <rect x="18" y="25" width="4" height="20" fill="url(#grad1)"/>

  <!-- 'O' - 軌道リング -->
  <circle cx="45" cy="30" r="12" fill="none" stroke="url(#grad1)" stroke-width="3"/>
  <circle cx="45" cy="30" r="3" fill="url(#grad1)"/>

  <!-- テキスト部分 -->
  <text x="70" y="25" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1E293B">
    iOrbit
  </text>
  <text x="70" y="42" font-family="Arial, sans-serif" font-size="10" fill="#64748B">
    Innovation in Motion
  </text>
</svg>