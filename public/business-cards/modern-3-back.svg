<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="33%" style="stop-color:#ff0080;stop-opacity:0.1" />
      <stop offset="66%" style="stop-color:#00ff80;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#8000ff;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="350" height="200" fill="url(#textureGrad)"/>

  <!-- Large Typography Background -->
  <text x="20" y="160" font-family="'Arial Black', sans-serif" font-size="180" font-weight="900" fill="rgba(0,0,0,0.03)" transform="rotate(-90)">株式会社</text>

  <!-- Information Grid -->
  <g transform="translate(40, 40)">
    <!-- Company Block -->
    <g>
      <rect x="-10" y="-15" width="270" height="30" fill="rgba(0,0,0,0.02)"/>
      <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#000000">株式会社iOrbit</text>
      <line x1="0" y1="10" x2="150" y2="10" stroke="#ff0080" stroke-width="2"/>
    </g>

    <!-- Address Block -->
    <g transform="translate(0, 50)">
      <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#666666" letter-spacing="1px">ADDRESS</text>
      <text x="0" y="15" font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#000000">〒581-0003</text>
      <text x="0" y="28" font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#000000">大阪府八尾市本町６－１４－１５</text>
      <line x1="0" y1="35" x2="180" y2="35" stroke="#00ff80" stroke-width="1"/>
    </g>

    <!-- Contact Block -->
    <g transform="translate(0, 100)">
      <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#666666" letter-spacing="1px">DIGITAL</text>
      <text x="0" y="15" font-family="'Helvetica Neue', sans-serif" font-size="12" fill="#000000" font-weight="500">https://iorbit.jp</text>
      <line x1="0" y1="25" x2="120" y2="25" stroke="#8000ff" stroke-width="1"/>
    </g>
  </g>

  <!-- Minimalist Service Indicators -->
  <g transform="translate(250, 50)">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#ff0080" stroke-width="2"/>
    <text x="-3" y="3" font-family="'Helvetica Neue', sans-serif" font-size="8" fill="#ff0080" font-weight="700">W</text>

    <circle cx="0" cy="25" r="8" fill="none" stroke="#00ff80" stroke-width="2"/>
    <text x="-4" y="28" font-family="'Helvetica Neue', sans-serif" font-size="8" fill="#00ff80" font-weight="700">M</text>

    <circle cx="0" cy="50" r="8" fill="none" stroke="#8000ff" stroke-width="2"/>
    <text x="-2" y="53" font-family="'Helvetica Neue', sans-serif" font-size="8" fill="#8000ff" font-weight="700">A</text>

    <circle cx="0" cy="75" r="8" fill="none" stroke="#333333" stroke-width="2"/>
    <text x="-2" y="78" font-family="'Helvetica Neue', sans-serif" font-size="8" fill="#333333" font-weight="700">I</text>
  </g>

  <!-- Legend -->
  <g transform="translate(270, 55)">
    <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-size="6" fill="#666666">Web</text>
    <text x="0" y="25" font-family="'Helvetica Neue', sans-serif" font-size="6" fill="#666666">Mobile</text>
    <text x="0" y="50" font-family="'Helvetica Neue', sans-serif" font-size="6" fill="#666666">Apps</text>
    <text x="0" y="75" font-family="'Helvetica Neue', sans-serif" font-size="6" fill="#666666">AI</text>
  </g>

  <!-- Border -->
  <rect x="5" y="5" width="340" height="190" fill="none" stroke="#000000" stroke-width="0.5"/>
</svg>