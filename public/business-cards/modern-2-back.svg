<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arch1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arch2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a29bfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6c5ce7;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#ddd" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background with Pattern -->
  <rect width="350" height="200" fill="#f8f9fa"/>
  <rect width="350" height="200" fill="url(#dots)"/>

  <!-- Abstract Architecture -->
  <g transform="translate(200, 30)">
    <!-- Tower 1 -->
    <path d="M0,100 L15,90 L15,40 L0,50 Z" fill="url(#arch1)" opacity="0.9"/>
    <path d="M0,100 L15,90 L30,100 L15,110 Z" fill="url(#arch2)" opacity="0.9"/>
    <path d="M15,90 L30,80 L30,100 L15,110 Z" fill="#2d3436" opacity="0.8"/>

    <!-- Tower 2 -->
    <g transform="translate(40, 20)">
      <path d="M0,80 L12,72 L12,30 L0,38 Z" fill="url(#arch2)" opacity="0.8"/>
      <path d="M0,80 L12,72 L24,80 L12,88 Z" fill="url(#arch1)" opacity="0.8"/>
      <path d="M12,72 L24,64 L24,80 L12,88 Z" fill="#636e72" opacity="0.7"/>
    </g>

    <!-- Tower 3 -->
    <g transform="translate(80, 10)">
      <path d="M0,90 L18,80 L18,25 L0,35 Z" fill="url(#arch1)" opacity="0.9"/>
      <path d="M0,90 L18,80 L36,90 L18,100 Z" fill="url(#arch2)" opacity="0.9"/>
      <path d="M18,80 L36,70 L36,90 L18,100 Z" fill="#2d3436" opacity="0.8"/>
    </g>
  </g>

  <!-- Company Info Block -->
  <g transform="translate(30, 40)">
    <rect x="-5" y="-10" width="160" height="60" fill="rgba(255,255,255,0.9)" rx="5"/>
    <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-size="14" font-weight="600" fill="#2d3436">株式会社iOrbit</text>
    <text x="0" y="18" font-family="'Helvetica Neue', sans-serif" font-size="9" fill="#636e72">〒581-0003</text>
    <text x="0" y="30" font-family="'Helvetica Neue', sans-serif" font-size="9" fill="#636e72">大阪府八尾市本町６－１４－１５</text>
    <text x="0" y="45" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#6c5ce7" font-weight="500">https://iorbit.jp</text>
  </g>

  <!-- Services Architecture -->
  <g transform="translate(30, 130)">
    <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="600" fill="#2d3436">Technology Solutions</text>

    <!-- Service Blocks -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="45" height="12" fill="#ff6b6b" opacity="0.8" rx="2"/>
      <text x="2" y="8" font-family="'Helvetica Neue', sans-serif" font-size="7" fill="white" font-weight="500">Windows</text>

      <rect x="50" y="0" width="35" height="12" fill="#4ecdc4" opacity="0.8" rx="2"/>
      <text x="52" y="8" font-family="'Helvetica Neue', sans-serif" font-size="7" fill="white" font-weight="500">Web</text>

      <rect x="90" y="0" width="40" height="12" fill="#f9ca24" opacity="0.8" rx="2"/>
      <text x="92" y="8" font-family="'Helvetica Neue', sans-serif" font-size="7" fill="white" font-weight="500">Mobile</text>

      <rect x="135" y="0" width="25" height="12" fill="#6c5ce7" opacity="0.8" rx="2"/>
      <text x="137" y="8" font-family="'Helvetica Neue', sans-serif" font-size="7" fill="white" font-weight="500">AI</text>
    </g>
  </g>

  <!-- Floating Geometric Elements -->
  <circle cx="50" cy="180" r="3" fill="#ff6b6b" opacity="0.6"/>
  <polygon points="70,175 75,185 65,185" fill="#4ecdc4" opacity="0.7"/>
  <rect x="90" y="177" width="6" height="6" fill="#f9ca24" opacity="0.8" rx="1"/>
</svg>