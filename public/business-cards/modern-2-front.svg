<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="isometric1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="isometric2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#45b7d1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f9ca24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="isometric3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#6c5ce7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fd79a8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="350" height="200" fill="#f8f9fa"/>

  <!-- 3D Isometric Blocks -->
  <g transform="translate(50, 30)">
    <!-- Block 1 -->
    <path d="M0,50 L30,35 L30,5 L0,20 Z" fill="url(#isometric1)" filter="url(#shadow)"/>
    <path d="M0,50 L30,35 L60,50 L30,65 Z" fill="url(#isometric2)" filter="url(#shadow)"/>
    <path d="M30,35 L60,20 L60,50 L30,65 Z" fill="url(#isometric3)" filter="url(#shadow)"/>

    <!-- Block 2 -->
    <g transform="translate(80, 20)">
      <path d="M0,30 L20,20 L20,0 L0,10 Z" fill="url(#isometric3)" filter="url(#shadow)"/>
      <path d="M0,30 L20,20 L40,30 L20,40 Z" fill="url(#isometric1)" filter="url(#shadow)"/>
      <path d="M20,20 L40,10 L40,30 L20,40 Z" fill="url(#isometric2)" filter="url(#shadow)"/>
    </g>

    <!-- Block 3 -->
    <g transform="translate(150, 10)">
      <path d="M0,40 L25,30 L25,10 L0,20 Z" fill="url(#isometric2)" filter="url(#shadow)"/>
      <path d="M0,40 L25,30 L50,40 L25,50 Z" fill="url(#isometric3)" filter="url(#shadow)"/>
      <path d="M25,30 L50,20 L50,40 L25,50 Z" fill="url(#isometric1)" filter="url(#shadow)"/>
    </g>
  </g>

  <!-- Floating iOrbit Text -->
  <g transform="translate(60, 120)">
    <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-size="24" font-weight="100" fill="#2d3436" letter-spacing="8px">iOrbit</text>
    <line x1="-10" y1="15" x2="150" y2="15" stroke="#fd79a8" stroke-width="3"/>
  </g>

  <!-- Name in Modern Typography -->
  <text x="60" y="150" font-family="'Helvetica Neue', sans-serif" font-size="16" font-weight="300" fill="#2d3436">高橋 宏輔</text>
  <text x="60" y="168" font-family="'Helvetica Neue', sans-serif" font-size="10" fill="#636e72" letter-spacing="1px">REPRESENTATIVE DIRECTOR</text>

  <!-- Contact -->
  <text x="60" y="188" font-family="'Helvetica Neue', sans-serif" font-size="11" fill="#6c5ce7" font-weight="500">info@iorbit.jp</text>

  <!-- Geometric Accent -->
  <circle cx="280" cy="150" r="8" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="300" cy="140" r="6" fill="#4ecdc4" opacity="0.6"/>
  <circle cx="320" cy="160" r="4" fill="#f9ca24" opacity="0.9"/>
</svg>