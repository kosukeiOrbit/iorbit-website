<svg width="350" height="200" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="subtleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="350" height="200" fill="url(#subtleGrad)" stroke="#d1d5db" stroke-width="1"/>

  <!-- iOrbit Logo (Large) -->
  <g transform="translate(175, 60)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#2563eb" text-anchor="middle">iOrbit</text>
    <circle cx="60" cy="-12" r="15" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2" opacity="0.6"/>
    <circle cx="60" cy="-12" r="8" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,1" opacity="0.8"/>
  </g>

  <!-- Tagline -->
  <text x="175" y="90" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#4b5563" text-anchor="middle">Premium Technology Partner</text>

  <!-- Quote -->
  <text x="175" y="120" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">"最先端技術とイノベーションで、</text>
  <text x="175" y="135" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">お客様のビジネス変革を実現する</text>
  <text x="175" y="150" font-family="Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">プレミアムテクノロジーパートナーです。"</text>
</svg>