<svg width="120" height="40" viewBox="0 0 120 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="50%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- 'i' のドット -->
  <circle cx="12" cy="12" r="2.5" fill="url(#pulseGrad)"/>

  <!-- 'i' の縦線 -->
  <rect x="10.5" y="17" width="3" height="14" rx="1.5" fill="url(#pulseGrad)"/>

  <!-- パルス波形 -->
  <path d="M 17 20 Q 21 15 25 20 Q 29 25 33 20" fill="none" stroke="url(#pulseGrad)" stroke-width="2" opacity="0.7"/>
  <path d="M 17 20 Q 21 25 25 20 Q 29 15 33 20" fill="none" stroke="url(#pulseGrad)" stroke-width="1.5" opacity="0.5"/>

  <!-- 中央のパルス点 -->
  <circle cx="25" cy="20" r="2" fill="url(#pulseGrad)">
    <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.7;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- エネルギー点 -->
  <circle cx="30" cy="18" r="1" fill="#f59e0b">
    <animateTransform attributeName="transform" type="translate" values="0,0; 4,2; 0,0; -4,-2; 0,0" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- テキスト -->
  <text x="44" y="18" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="url(#pulseGrad)">iOrbit</text>
  <text x="44" y="30" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#64748B">TECHNOLOGY</text>
</svg>